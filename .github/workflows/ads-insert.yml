name: Ad slots insert (posts without ads)
on:
  workflow_dispatch:
    inputs:
      n:
        default: "10"
      dry:
        default: "no"
      ids:
        default: ""
      swap:
        default: "no"
concurrency:
  group: geo
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          U: ${{ secrets.WP_USER }}
          P: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 _ads/insert.py ${{ inputs.n }} ${{ inputs.dry == 'yes' && 'dry' || 'live' }} "${{ inputs.ids }}" ${{ inputs.swap == 'yes' && 'swap' || 'add' }}
      - run: |
          git config user.name "ib-ads-bot"; git config user.email "ib-ads-bot@users.noreply.github.com"
          git add _ads && (git diff --cached --quiet || git commit -m "Ad slots insert") && git pull --rebase -q && git push -q
