name: WordPress post patch (fetch or apply)
on:
  workflow_dispatch:
    inputs:
      mode:
        default: "fetch"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          U: ${{ secrets.WP_USER }}
          P: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 _patch/wp_patch.py ${{ inputs.mode }}
      - if: inputs.mode == 'fetch'
        run: |
          git config user.name "ib-patch-bot"; git config user.email "ib-patch-bot@users.noreply.github.com"
          git add _patch/wp && (git diff --cached --quiet || git commit -m "Fetch WP posts for patch") && git pull --rebase -q && git push -q
