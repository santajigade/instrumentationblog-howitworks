name: Article publish
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "comma separated post ids"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          U: ${{ secrets.WP_USER }}
          P: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          [ -n "${{ inputs.ids }}" ] && python3 _import/publish.py "${{ inputs.ids }}"
          python3 _import/rmscore.py
