name: Fix wrong blog links in static pages
on: workflow_dispatch
concurrency:
  group: ftp-deploy
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -e
          FILES="tools/pid-tuning/pid-simulator/index.html"
          S="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no"
          for f in $FILES; do mkdir -p "w/$(dirname $f)"; lftp -u "$U","$P" "$H" -e "$S; get ${D%/}/$f -o w/$f; bye"; done
          for f in $FILES; do sed -i 's#href="how-scada-systems-work"#href="https://www.instrumentationblog.in/how-scada-systems-work/"#g' "w/$f"; grep -c 'instrumentationblog.in/how-scada-systems-work/' "w/$f"; done
          for f in $FILES; do lftp -u "$U","$P" "$H" -e "$S; put w/$f -o ${D%/}/$f; bye"; done
          echo "Uploaded"
