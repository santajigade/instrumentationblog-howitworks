name: Static page patch (fetch or upload)

# fetch: downloads the live files listed in _patch/files.txt into _patch/live/ and commits them.
# upload: uploads _patch/out/<path> files to the same paths on the server (only files present in _patch/out).
on:
  workflow_dispatch:
    inputs:
      mode:
        default: "fetch"

permissions:
  contents: write

concurrency:
  group: ga-tag
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          S="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:max-retries 3"
          : > job.lftp; echo "$S" >> job.lftp; echo "open -u \"$U\",\"$P\" \"$H\"" >> job.lftp
          if [ "${{ inputs.mode }}" = "fetch" ]; then
            while read f; do [ -z "$f" ] && continue; mkdir -p "_patch/live/$(dirname "$f")"; echo "get ${D%/}/$f -o _patch/live/$f" >> job.lftp; done < _patch/files.txt
            echo bye >> job.lftp; lftp -f job.lftp
            echo "FETCHED $(find _patch/live -name '*.html' | wc -l)"
            git config user.name "ib-patch-bot"; git config user.email "ib-patch-bot@users.noreply.github.com"
            git add _patch/live && (git diff --cached --quiet || git commit -m "Fetch live static pages for patch") && git pull --rebase -q && git push -q
          else
            n=0
            while read f; do [ -z "$f" ] && continue; [ -f "_patch/out/$f" ] || continue; echo "put -O ${D%/}/$(dirname "$f") _patch/out/$f" >> job.lftp; n=$((n+1)); done < _patch/files.txt
            echo bye >> job.lftp; lftp -f job.lftp && echo "UPLOADED $n"
          fi
