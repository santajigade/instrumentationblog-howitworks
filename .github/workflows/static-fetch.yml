name: Static fetch (read only)
on:
  workflow_dispatch:
    inputs:
      paths:
        description: space separated paths under public_html
        required: true
concurrency:
  group: geo
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          S="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no"
          for p in ${{ inputs.paths }}; do mkdir -p "_static/$(dirname $p)"; lftp -u "$U","$P" "$H" -e "$S; get ${D%/}/$p -o _static/$p; bye"; done
          git config user.name "ib-bot"; git config user.email "ib-bot@users.noreply.github.com"
          git add _static && git commit -qm "Static fetch" && git pull --rebase -q && git push -q
