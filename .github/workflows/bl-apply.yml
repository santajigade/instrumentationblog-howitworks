name: Zenta backlinks
on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      n:
        default: "15"
      dry:
        default: "no"
concurrency:
  group: geo
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          U: ${{ secrets.WP_USER }}
          P: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 _bl/run.py ${{ inputs.n || '15' }} ${{ inputs.dry == 'yes' && 'dry' || '' }}
      - run: |
          git config user.name "ib-bl-bot"; git config user.email "ib-bl-bot@users.noreply.github.com"
          git add _bl && (git diff --cached --quiet || git commit -m "Backlinks run") && git pull --rebase -q && git push -q
