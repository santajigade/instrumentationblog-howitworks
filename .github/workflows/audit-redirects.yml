name: Grep static backup
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: originals-backup
          path: static
          run-id: 43709427775
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          echo "FILES $(find static site -type f | wc -l)"
          echo "HITS_UPLOADS_2026_04 $(grep -rl 'uploads/2026/04' static site | wc -l)"
          echo "HITS_CHPDF $(grep -rlE '(^|[/\"])(Ch|Sn)[0-9]+\.pdf|App\.pdf' static site | wc -l)"
          grep -rlE 'uploads/2026/04|(Ch|Sn)[0-9]+\.pdf' static site | head -5 | sed 's/^/HIT|/'
