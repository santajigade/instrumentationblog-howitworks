name: Check URL status
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read u; do [ -z "$u" ] && continue
            r=$(curl -s -o /tmp/b -A "Mozilla/5.0 Chrome/130" -w '%{http_code} %{num_redirects} %{url_effective}' -L --max-redirs 10 "$u")
            echo "RES|$u|$r"
          done < _audit/check-urls.txt
          echo "== where is the pid simulator relative link"
          curl -s -A "Mozilla/5.0 Chrome/130" https://www.instrumentationblog.in/tools/pid-tuning/pid-simulator/ | grep -o 'href="[^"]*how-scada-systems-work[^"]*"' | sed 's/^/LINK|/'
          echo "== type-b page file links"
          curl -s -A "Mozilla/5.0 Chrome/130" https://www.instrumentationblog.in/downloads/engineering-reference-tables/type-b-thermocouple-table/ | grep -oE 'href="[^"]*\.(xlsx|pdf)"' | sed 's/^/LINK|/'
