name: Upload mu-plugin
on: workflow_dispatch
concurrency:
  group: geo
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l _mu/ib-home-ad-units.php && sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          S="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no"
          lftp -u "$U","$P" "$H" -e "$S; mkdir -p ${D%/}/wp-content/mu-plugins; put -O ${D%/}/wp-content/mu-plugins _mu/ib-home-ad-units.php; cls -l ${D%/}/wp-content/mu-plugins; bye"
