name: Page check
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36" "${{ inputs.url }}?nc=$RANDOM" -o p.html; wc -c p.html
          echo "--- snip"; python3 -c "
          import re,collections;s=open('p.html').read();c=collections.Counter(re.findall(r'class=.([^\x22\x27]+)',s))
          [print(n,k) for k,n in c.most_common(45) if 6<=n<=40]
          i=s.find('post-has-image');i=i if i>0 else s.find('rt-post');print(s[i-1200:i+1800])
          " || true; echo "--- domains in ads.txt"; cut -d, -f1 p.html | tr A-Z a-z | sort | uniq -c | sort -rn | head -40; echo "--- scripts"; grep -o 'src="[^"]*"' p.html | grep -iv "wp-content\|wp-includes\|\.jpg\|\.png\|\.webp" | sort -u | head -40; echo "--- ins tags"; grep -o '<ins class="adsbygoogle"[^>]*>' p.html | grep -o 'data-ad-slot="[0-9]*"\|autorelaxed' | uniq -c
          echo "--- sidebar"; grep -o 'ibsb[a-z-]*' p.html | sort | uniq -c
          echo "--- house/unfilled"; grep -o 'ib-house[^"]*\|ibh-js\|unfilled[^}]*}' p.html | head
          echo "--- widgets"; grep -o 'id="custom_html-[0-9]*"' p.html
          python3 -c "
          import re;s=open('p.html').read()
          [print(m.group(1), re.findall(r'data-ad-slot=.(\d+)', s[m.start():m.start()+1500])) for m in re.finditer(r'id=.custom_html-(\d+)', s)]
          " || true
