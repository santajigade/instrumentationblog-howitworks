name: Article import (drafts)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          U: ${{ secrets.WP_USER }}
          P: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 _import/import.py
      - run: |
          git config user.name "ib-import-bot"; git config user.email "ib-import-bot@users.noreply.github.com"
          git rm -rq _upload/ibtmp-* || true
          git add _import && git commit -m "Article import results" && git pull --rebase -q && git push -q
